# Builds the Android APK and publishes it as a GitHub release.
# A new release is created automatically whenever the version in package.json
# changes on main (e.g. 1.2.0 -> 1.3.0 creates "v1.3.0"). Running the workflow
# manually rebuilds the APK of the current version and replaces it in the release.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_B64  base64 of android/lingopingo.keystore
#   LINGOPINGO_KS_PASS    keystore password
name: Android APK release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: rel
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide
        id: go
        run: |
          if [ "${{ steps.rel.outputs.exists }}" = "false" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.v.outputs.tag }} already exists – bump the version in package.json for a new one."
          fi

      - uses: actions/setup-java@v5
        if: steps.go.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        if: steps.go.outputs.build == 'true'
        with:
          node-version: '22'

      - name: Install Android SDK packages
        if: steps.go.outputs.build == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Restore signing key
        if: steps.go.outputs.build == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_B64 is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/lingopingo.keystore

      - name: Build APK
        if: steps.go.outputs.build == 'true'
        env:
          LINGOPINGO_KS_PASS: ${{ secrets.LINGOPINGO_KS_PASS }}
        run: |
          node android/build.mjs
          cp android/dist/LingoPingo.apk "android/dist/LingoPingo-${{ steps.v.outputs.tag }}.apk"

      - name: Publish release
        if: steps.go.outputs.build == 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          APK="android/dist/LingoPingo-$TAG.apk"
          if [ "${{ steps.rel.outputs.exists }}" = "true" ]; then
            gh release upload "$TAG" "$APK" android/dist/LingoPingo.apk --clobber
          else
            gh release create "$TAG" "$APK" android/dist/LingoPingo.apk \
              --title "LingoPingo ${{ steps.v.outputs.version }}" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --notes "Android app: download **LingoPingo.apk**, open it on your phone and allow installing from unknown sources. Updates install over the previous version."
          fi

      - name: Remove signing key
        if: always()
        run: rm -f android/lingopingo.keystore
