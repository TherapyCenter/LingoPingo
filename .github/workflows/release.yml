# Builds the Android APK, the Windows installer and the iOS app, publishes them as a GitHub
# release and deploys the web app (for iPhone and browsers) to GitHub Pages.
# A new release is created automatically whenever the version in package.json changes
# on main (e.g. 1.3.0 -> 1.4.0 creates "v1.4.0"). Running the workflow manually rebuilds
# the current version and replaces the files in its release.
#
# Required repository secrets (Android signing):
#   ANDROID_KEYSTORE_B64  base64 of android/lingopingo.keystore
#   LINGOPINGO_KS_PASS    keystore password
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.rel.outputs.exists }}
      build: ${{ steps.go.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check for existing release
        id: rel
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Decide
        id: go
        run: |
          if [ "${{ steps.rel.outputs.exists }}" = "false" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.v.outputs.tag }} already exists – bump the version in package.json for a new one."
          fi

  android:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_B64 is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/lingopingo.keystore
      - name: Build APK
        env:
          LINGOPINGO_KS_PASS: ${{ secrets.LINGOPINGO_KS_PASS }}
        run: |
          node android/build.mjs
          cp android/dist/LingoPingo.apk "android/dist/LingoPingo-$TAG.apk"
      - name: Create release / upload APK
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "android/dist/LingoPingo-$TAG.apk" android/dist/LingoPingo.apk --clobber
          else
            gh release create "$TAG" "android/dist/LingoPingo-$TAG.apk" android/dist/LingoPingo.apk \
              --title "LingoPingo ${{ needs.prepare.outputs.version }}" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --notes "**Android:** download \`LingoPingo.apk\`, open it on your phone and allow installing from unknown sources.
          **Windows:** download \`LingoPingo-Setup-${{ needs.prepare.outputs.version }}.exe\` and run it. The app checks for updates on its own.
          **iPhone:** open https://therapycenter.github.io/LingoPingo/ in Safari and tap Share → Add to Home Screen (updates automatically). Alternatively sideload \`LingoPingo-unsigned.ipa\` with AltStore or Sideloadly.
          Updates install over the previous version, your progress is kept."
          fi
      - name: Remove signing key
        if: always()
        run: rm -f android/lingopingo.keystore

  windows:
    needs: [prepare, android]
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Set app version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never
      - name: Upload installer to release
        run: |
          gh release upload "$TAG" \
            "dist/LingoPingo-Setup-$VERSION.exe" \
            "dist/LingoPingo-Setup-$VERSION.exe.blockmap" \
            dist/latest.yml --clobber

  ios:
    needs: [prepare, android]
    if: needs.prepare.outputs.build == 'true'
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Bundle web app
        run: |
          rm -rf public
          cp -R ../public public
          rm -rf public/download
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project LingoPingo.xcodeproj -target LingoPingo -configuration Release -sdk iphoneos \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 30
      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/LingoPingo.app Payload/
          zip -qry LingoPingo-unsigned.ipa Payload
          cp LingoPingo-unsigned.ipa "LingoPingo-$TAG-unsigned.ipa"
          ls -la *.ipa
      - name: Upload IPA to release
        run: gh release upload "$TAG" LingoPingo-unsigned.ipa "LingoPingo-$TAG-unsigned.ipa" --clobber

  # Web app for iPhone & browsers on GitHub Pages (Safari: Share -> Add to Home Screen)
  pages:
    needs: [prepare, android]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare site
        run: rm -rf public/download
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
